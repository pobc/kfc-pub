name: Unit Tests

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kfc
          POSTGRES_PASSWORD: kfc
          POSTGRES_DB: kfc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kfc -d kfc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://kfc:kfc@127.0.0.1:5432/kfc
      APP_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Initialize PostgreSQL
        env:
          PGPASSWORD: kfc
        run: psql -h 127.0.0.1 -U kfc -d kfc -f database.sql

      - name: Validate and format
        run: |
          sed -i 's/from app.database.repositories import kfc_tickets/from app.database.kfc import ticket_db as kfc_tickets/' tests/test_query_order_detail.py
          python -m ruff format --check app tools tests
          python -m compileall -q app tools tests
          python -m ruff check app tools tests
          node --check app/web/static/admin/js/products.js
          node --check app/web/static/admin/js/access-links.js
          python -m pytest

