<section class="admin-section admin-panel taobao-keyword-panel" data-panel="taobao-keywords" hidden>
  <div class="panel-heading">
    <div>
      <h2>淘宝搜索关键词</h2>
      <p>保存常用搜索关键词和淘宝搜索链接，在淘宝价格页面选择后即可填入抓取链接。</p>
    </div>
  </div>
  <form class="taobao-keyword-form" id="taobao-keyword-form">
    <label>搜索关键词<input id="taobao-keyword-name" maxlength="200" required placeholder="例如：肯德基代下单" /></label>
    <label>URL<input id="taobao-keyword-url" type="url" maxlength="2000" required placeholder="https://s.taobao.com/search?q=..." /></label>
    <button class="button button--primary" id="taobao-keyword-save" type="submit">新增关键词</button>
    <button class="text-button text-button--muted" id="taobao-keyword-cancel" type="button" hidden>取消编辑</button>
  </form>
  <form class="taobao-keyword-search" id="taobao-keyword-filter">
    <input aria-label="搜索关键词或 URL" id="taobao-keyword-search" maxlength="200" placeholder="搜索关键词或 URL" />
    <button class="button button--dark" type="submit">查询</button>
    <button class="text-button text-button--muted" id="taobao-keyword-reset" type="button">清空</button>
    <span id="taobao-keyword-count" aria-live="polite"></span>
  </form>
  <div class="data-table">
    <div class="data-row taobao-keyword-row table-head">
      <span>ID</span><span>搜索关键词</span><span>URL</span><span>插入时间</span><span>修改时间</span><span>操作</span>
    </div>
    <div id="taobao-keyword-rows"></div>
    <div class="table-empty" id="taobao-keyword-empty" hidden>暂无符合条件的关键词</div>
  </div>
  <div class="redemption-pagination" id="taobao-keyword-pagination" hidden></div>
</section>
